name: Deploy to EC2

on:

  push:

    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Copy project to EC2

        uses: appleboy/scp-action@v0.1.7

        with:

          host: ${{ secrets.HOST }}

          username: ubuntu

          key: ${{ secrets.SSH_KEY }}

          source: "."

          target: "/home/ubuntu/resource-sharing"

      - name: Deploy

        uses: appleboy/ssh-action@v1.0.3

        with:

          host: ${{ secrets.HOST }}

          username: ubuntu

          key: ${{ secrets.SSH_KEY }}

          script: |

            cd /home/ubuntu/resource-sharing

            docker compose down

            docker compose up --build -d

            docker image prune -af